[custom]

; Local network
ruleset=DIRECT,[]GEOIP,LAN

; Iran domain rules
ruleset=DIRECT,clash-domain:https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/ir.yaml,86400

; Iran IP CIDR rules
ruleset=DIRECT,clash-ipcidr:https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/ircidr.yaml,86400

; Block UDP traffic for remaining destinations
ruleset=REJECT,[]NETWORK,udp

; Final rule
ruleset=✅ Selector,[]FINAL

; Main proxy selection
custom_proxy_group=✅ Selector`select`[]♻️ Auto`.*

; Automatic fastest-node selection
custom_proxy_group=♻️ Auto`url-test`.*`https://www.gstatic.com/generate_204`120,,50

; Rule generation
enable_rule_generator=true
overwrite_original_rules=true
