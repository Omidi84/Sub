```ini
[custom]

; Iran domain rules
ruleset=🇮🇷 Iran Direct,https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/ir.txt

; Iran IP CIDR rules
ruleset=🇮🇷 Iran Direct,https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/ircidr.txt

; Final proxy rule
ruleset=✅ Selector,[]FINAL

; Proxy groups
custom_proxy_group=✅ Selector`select`.*

custom_proxy_group=🇮🇷 Iran Direct`select`[]DIRECT

; Rule generation
enable_rule_generator=true
overwrite_original_rules=true
```
