[custom]

; Local network
ruleset=DIRECT,[]GEOIP,IR

; Local network
ruleset=DIRECT,[]GEOSITE,IR

; Local network
ruleset=DIRECT,[]GEOIP,LAN

; Block UDP
ruleset=REJECT,[]NETWORK,udp

; Iran domain rules
ruleset=DIRECT,clash-domain:https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/ir.txt,86400

; Iran IP rules
ruleset=DIRECT,clash-ipcidr:https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/ircidr.txt,86400

; Final rule
ruleset=✅ Selector,[]FINAL

; Proxy groups
custom_proxy_group=✅ Selector`select`.*

; Rule generator
enable_rule_generator=true
overwrite_original_rules=true
